<style>

  input:focus { outline: 2px solid var(--olive); outline-offset: 1px; }
  button { font: inherit; font-size: 15px; letter-spacing: .12em; padding: 12px; border: 0; background: var(--olive); color: #fff; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #err { font-size: 13px; color: #9A3B2E; min-height: 1em; }
</style>

const KEY = 'hj-pw';
async function open(pw) {
  const raw = Uint8Array.from(atob(DATA), c => c.charCodeAt(0));
  const salt = raw.slice(0, 16), iv = raw.slice(16, 28), enc = raw.slice(28);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 600000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, enc);
  const html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open(); document.write(html); document.close();
}
const f = document.getElementById('f'), pw = document.getElementById('pw'), err = document.getElementById('err');
f.addEventListener('submit', async e => {
  e.preventDefault();
  if (!pw.value) { err.textContent = 'パスワードを入力してください'; return; }
  try {
    await open(pw.value);
    try { sessionStorage.setItem(KEY, pw.value); } catch (_) {}
  } catch (_) { err.textContent = 'パスワードが違います'; }
});
pw.addEventListener('input', () => { err.textContent = ''; });
try { const s = sessionStorage.getItem(KEY); if (s) open(s).catch(() => {}); } catch (_) {}
</script>
